<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Website Đang Bảo Trì</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .banner {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    animation: fadeIn 0.6s ease-out;
  }

  .banner .badge {
    font-size: 40px;
    animation: bounce 2s infinite;
    flex-shrink: 0;
  }

  .banner-text h1 {
    color: #333;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .banner-text p {
    color: #666;
    font-size: 13px;
    line-height: 1.5;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .game-wrapper {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    background: #87CEEB;
    animation: fadeIn 0.8s ease-out;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    cursor: pointer;
  }

  .mute-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.5);
    background: rgba(0, 0, 0, 0.45);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }

  .mute-btn:hover {
    background: rgba(0, 0, 0, 0.7);
    transform: scale(1.1);
  }

  .mute-btn:active {
    transform: scale(0.95);
  }

  .mute-btn.muted {
    background: rgba(220, 53, 69, 0.7);
  }

  .hint {
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    font-weight: 500;
  }

  .contact {
    text-align: center;
    color: rgba(255, 255, 255, 0.75);
    font-size: 13px;
    padding: 8px 0;
  }

  .contact a {
    color: #FFD700;
    font-weight: 600;
    text-decoration: none;
  }

  .contact a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="page">
  <header class="banner">
    <div class="badge">🚧</div>
    <div class="banner-text">
      <h1>Website đang bảo trì</h1>
      <p>Chúng tôi đang nâng cấp hệ thống. Trong lúc chờ, chơi chút cho vui nhé!</p>
    </div>
  </header>

  <div class="game-wrapper">
    <canvas id="game"></canvas>
    <button id="muteBtn" class="mute-btn" title="Bật/tắt âm thanh">🔊</button>
  </div>

  <div class="hint">Nhấn <b>Space</b> hoặc <b>chạm</b> để điều khiển chim</div>

  <footer class="contact">
    Cần hỗ trợ? <a href="mailto:support@yourdomain.com">support@yourdomain.com</a>
  </footer>
</div>

<script>
(function() {
  'use strict';

  // ============================================================
  // 🎵 HỆ THỐNG ÂM THANH (Web Audio API - không cần file MP3)
  // ============================================================
  let audioCtx = null;
  let muted = localStorage.getItem('flappyMuted') === '1';

  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        console.warn('Web Audio API không được hỗ trợ');
        return;
      }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  /**
   * Tạo một nốt nhạc
   * @param {number} freq     - Tần số bắt đầu (Hz)
   * @param {number} start    - Trễ (giây) so với hiện tại
   * @param {number} duration - Thời lượng (giây)
   * @param {string} type     - 'sine' | 'square' | 'sawtooth' | 'triangle'
   * @param {number} volume   - Âm lượng 0.0 → 1.0
   * @param {number} freqEnd  - Tần số kết thúc (tùy chọn, để tạo hiệu ứng trượt)
   */
  function tone(freq, start, duration, type, volume, freqEnd) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (freqEnd && freqEnd > 0) {
      osc.frequency.exponentialRampToValueAtTime(freqEnd, t + duration);
    }

    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  // ---- Các hiệu ứng âm thanh ----
  function sndFlap() {
    // Tiếng "vút" khi vỗ cánh
    tone(520, 0, 0.09, 'square', 0.06, 280);
  }

  function sndScore() {
    // Tiếng "ding ding" khi qua ống
    tone(880, 0, 0.08, 'sine', 0.13);
    tone(1320, 0.08, 0.15, 'sine', 0.13);
  }

  function sndHit() {
    // Tiếng va chạm
    tone(180, 0, 0.12, 'sawtooth', 0.18, 70);
  }

  function sndDie() {
    // Tiếng rơi/Game Over (trượt xuống)
    tone(500, 0, 0.4, 'sine', 0.15, 120);
    tone(200, 0.05, 0.55, 'sawtooth', 0.07, 60);
  }

  function sndStart() {
    // Tiếng bắt đầu game (2 nốt đi lên)
    tone(440, 0, 0.08, 'triangle', 0.12);
    tone(660, 0.09, 0.12, 'triangle', 0.12);
  }

  // ---- Nút bật/tắt âm thanh ----
  const muteBtn = document.getElementById('muteBtn');

  function updateMuteBtn() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('muted', muted);
    muteBtn.title = muted ? 'Bật âm thanh' : 'Tắt âm thanh';
  }
  updateMuteBtn();

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
    muted = !muted;
    localStorage.setItem('flappyMuted', muted ? '1' : '0');
    updateMuteBtn();
    if (!muted) sndScore(); // Nghe thử để biết đã bật
  });

  // ============================================================
  // 🎮 GAME SETUP
  // ============================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 400;
  const H = 600;
  const GROUND_H = 60;
  const GROUND_Y = H - GROUND_H;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const bird = {
    x: 90,
    y: H / 2,
    r: 15,
    vy: 0,
    rotation: 0,
    gravity: 0.5,
    jump: -8
  };

  const PIPE_W = 62;
  const PIPE_GAP = 155;
  const PIPE_SPEED = 2.6;
  const SPAWN_INTERVAL = 95;

  let pipes = [];
  let score = 0;
  let best = parseInt(localStorage.getItem('flappyBest') || '0', 10);
  let state = 'ready';
  let spawnCounter = 0;
  let frames = 0;
  let lastTime = 0;
  let deathTime = 0;

  const clouds = [
    { x: 40,  y: 90,  s: 1 },
    { x: 200, y: 160, s: 0.7 },
    { x: 320, y: 70,  s: 1.15 }
  ];

  // ============================================================
  // HELPERS
  // ============================================================
  function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ============================================================
  // GAME LOGIC
  // ============================================================
  function spawnPipe() {
    const minTop = 70;
    const maxTop = GROUND_Y - PIPE_GAP - 60;
    const topH = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: W, topH, scored: false });
  }

  function resetGame() {
    score = 0;
    pipes = [];
    bird.y = H / 2;
    bird.vy = 0;
    bird.rotation = 0;
    spawnCounter = 0;
  }

  function die() {
    if (state !== 'playing') return;
    state = 'gameover';
    deathTime = performance.now();
    sndHit();
    setTimeout(sndDie, 120);
    if (score > best) {
      best = score;
      localStorage.setItem('flappyBest', String(best));
    }
  }

  function handleFlap() {
    initAudio();

    if (state === 'ready') {
      resetGame();
      state = 'playing';
      bird.vy = bird.jump;
      sndFlap();
      sndStart();
    } else if (state === 'playing') {
      bird.vy = bird.jump;
      sndFlap();
    } else if (state === 'gameover') {
      if (performance.now() - deathTime < 500) return;
      resetGame();
      state = 'playing';
      bird.vy = bird.jump;
      sndFlap();
      sndStart();
    }
  }

  function update(dt) {
    bird.vy += bird.gravity * dt;
    bird.y += bird.vy * dt;
    bird.rotation = Math.max(-0.5, Math.min(1.2, bird.vy * 0.05));

    spawnCounter += dt;
    if (spawnCounter >= SPAWN_INTERVAL) {
      spawnPipe();
      spawnCounter = 0;
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED * dt;

      if (p.x + PIPE_W < 0) {
        pipes.splice(i, 1);
        continue;
      }

      if (!p.scored && p.x + PIPE_W < bird.x - bird.r) {
        p.scored = true;
        score++;
        sndScore();
      }

      const hitTop = circleRectCollide(bird.x, bird.y, bird.r, p.x, 0, PIPE_W, p.topH);
      const bottomY = p.topH + PIPE_GAP;
      const hitBottom = circleRectCollide(
        bird.x, bird.y, bird.r,
        p.x, bottomY, PIPE_W, GROUND_Y - bottomY
      );
      if (hitTop || hitBottom) die();
    }

    if (bird.y + bird.r >= GROUND_Y) {
      bird.y = GROUND_Y - bird.r;
      die();
    }
    if (bird.y - bird.r < 0) {
      bird.y = bird.r;
      bird.vy = 0;
    }
  }

  function updateClouds(dt) {
    for (const c of clouds) {
      c.x -= 0.3 * dt;
      if (c.x < -100) c.x = W + 100;
    }
  }

  // ============================================================
  // DRAW
  // ============================================================
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#87CEEB');
    g.addColorStop(1, '#BFE6F2');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawClouds() {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    for (const c of clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 18 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 22 * c.s, c.y - 6 * c.s, 24 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 48 * c.s, c.y, 18 * c.s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPipe(p) {
    const capH = 24;
    const topH = p.topH;
    const botY = topH + PIPE_GAP;
    const botH = GROUND_Y - botY;

    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(p.x, 0, PIPE_W, topH - capH);
    ctx.fillStyle = '#66BB6A';
    ctx.fillRect(p.x + 6, 0, 12, topH - capH);

    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(p.x - 5, topH - capH, PIPE_W + 10, capH);
    ctx.fillStyle = '#66BB6A';
    ctx.fillRect(p.x + 6, topH - capH, 12, capH);

    ctx.strokeStyle = '#2E7D32';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, 0, PIPE_W, topH - capH);
    ctx.strokeRect(p.x - 5, topH - capH, PIPE_W + 10, capH);

    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(p.x, botY + capH, PIPE_W, botH - capH);
    ctx.fillStyle = '#66BB6A';
    ctx.fillRect(p.x + 6, botY + capH, 12, botH - capH);

    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(p.x - 5, botY, PIPE_W + 10, capH);
    ctx.fillStyle = '#66BB6A';
    ctx.fillRect(p.x + 6, botY, 12, capH);

    ctx.strokeStyle = '#2E7D32';
    ctx.strokeRect(p.x, botY + capH, PIPE_W, botH - capH);
    ctx.strokeRect(p.x - 5, botY, PIPE_W + 10, capH);
  }

  function drawGround() {
    ctx.fillStyle = '#8BC34A';
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);
    ctx.fillStyle = '#9CCC65';
    ctx.fillRect(0, GROUND_Y, W, 10);
    ctx.fillStyle = '#7CB342';
    ctx.fillRect(0, GROUND_Y + 10, W, 4);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    ctx.fillStyle = '#FFD93D';
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#E6B800';
    ctx.lineWidth = 2;
    ctx.stroke();

    const wingOffset = state === 'playing' ? Math.sin(frames * 0.35) * 4 : 0;
    ctx.fillStyle = '#FFC107';
    ctx.beginPath();
    ctx.ellipse(-4, 2 + wingOffset, 10, 7, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FF6B35';
    ctx.beginPath();
    ctx.moveTo(15, -2);
    ctx.lineTo(26, 2);
    ctx.lineTo(15, 6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawScore() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px Arial';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#333';
    ctx.strokeText(score, W / 2, 88);
    ctx.fillStyle = '#fff';
    ctx.fillText(score, W / 2, 88);
    ctx.restore();
  }

  function drawReadyScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.font = 'bold 40px Arial';
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#333';
    ctx.strokeText('Flappy Bird', W / 2, H / 2 - 50);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('Flappy Bird', W / 2, H / 2 - 50);

    ctx.font = 'bold 18px Arial';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#333';
    ctx.strokeText('Nhấn Space / Chạm để bay', W / 2, H / 2 + 15);
    ctx.fillStyle = '#fff';
    ctx.fillText('Nhấn Space / Chạm để bay', W / 2, H / 2 + 15);

    ctx.font = 'bold 16px Arial';
    ctx.lineWidth = 4;
    ctx.strokeText('🏆 Kỷ lục: ' + best, W / 2, H / 2 + 55);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('🏆 Kỷ lục: ' + best, W / 2, H / 2 + 55);

    ctx.restore();
  }

  function drawGameOverScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(0, 0, W, H);

    const pw = 280, ph = 240;
    const px = (W - pw) / 2;
    const py = (H - ph) / 2;

    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 20;
    roundRect(px, py, pw, ph, 20);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';

    ctx.font = 'bold 32px Arial';
    ctx.fillStyle = '#E53935';
    ctx.fillText('Game Over', W / 2, py + 55);

    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#666';
    ctx.fillText('Điểm: ' + score, W / 2, py + 100);

    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = '#FF9800';
    ctx.fillText('🏆 Kỷ lục: ' + best, W / 2, py + 135);

    ctx.font = 'bold 15px Arial';
    ctx.fillStyle = '#667eea';
    ctx.fillText('Nhấn để chơi lại', W / 2, py + 195);

    ctx.font = '13px Arial';
    ctx.fillStyle = '#aaa';
    ctx.fillText('(Space hoặc chạm)', W / 2, py + 218);

    ctx.restore();
  }

  function draw() {
    drawSky();
    drawClouds();
    for (const p of pipes) drawPipe(p);
    drawGround();

    if (state === 'ready') {
      bird.y = H / 2 + Math.sin(frames * 0.06) * 10;
      bird.rotation = 0;
    }

    drawBird();

    if (state === 'playing' || state === 'gameover') {
      drawScore();
    }
    if (state === 'ready') drawReadyScreen();
    if (state === 'gameover') drawGameOverScreen();
  }

  // ============================================================
  // LOOP
  // ============================================================
  function loop(now) {
    if (!lastTime) lastTime = now;
    const dt = Math.min((now - lastTime) / (1000 / 60), 3);
    lastTime = now;

    updateClouds(dt);
    if (state === 'playing') update(dt);
    frames += dt;

    draw();
    requestAnimationFrame(loop);
  }

  // ============================================================
  // INPUT
  // ============================================================
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleFlap();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ') {
      e.preventDefault();
      handleFlap();
    }
  });

  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
